<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#37474f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mowa Taty</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="boot">Uruchamiam…</div>

<div id="app" hidden>

  <!-- pasek budowania zdania -->
  <header id="sentenceBar">
    <div id="sentence" aria-live="polite"></div>
    <div id="barActions">
      <button id="btnSpeakAll" type="button" title="Powiedz całe zdanie">
        <span aria-hidden="true">🔊</span><span>Powiedz</span>
      </button>
      <button id="btnBackspace" type="button" title="Usuń ostatnie">
        <span aria-hidden="true">⌫</span><span>Kasuj</span>
      </button>
      <button id="btnSend" type="button" title="Wyślij komunikat">
        <span aria-hidden="true">➤</span><span>Wyślij</span>
      </button>
    </div>
  </header>

  <!-- nagłówek tablicy (przytrzymaj 3 s = tryb opiekuna) -->
  <div id="boardHead">
    <span id="boardTitle">Start</span>
    <span id="modeTag">TRYB OPIEKUNA</span>
  </div>

  <!-- kafelki -->
  <main id="grid"></main>

  <!-- stały dolny pasek: TAK / NIE zawsze widoczne -->
  <nav id="nav">
    <button id="btnYes" type="button">TAK</button>
    <button id="btnNo" type="button">NIE</button>
    <button id="btnUp" type="button"><span aria-hidden="true">⬅</span><span>Wstecz</span></button>
    <button id="btnHome" type="button"><span aria-hidden="true">⌂</span><span>Start</span></button>
  </nav>

</div>

<!-- arkusz wysyłki -->
<div class="sheet" id="sendSheet">
  <div class="sheet-inner">
    <h2>Wyślij komunikat</h2>
    <div class="msg-preview" id="sendPreview"></div>
    <div class="big-actions" id="sendActions"></div>
    <button class="sheet-close" type="button" data-close="sendSheet">Zamknij</button>
  </div>
</div>

<!-- arkusz osoby -->
<div class="sheet" id="personSheet">
  <div class="sheet-inner">
    <h2 id="personName">Osoba</h2>
    <div class="msg-preview" id="personPreview"></div>
    <div class="big-actions" id="personActions"></div>
    <button class="sheet-close" type="button" data-close="personSheet">Zamknij</button>
  </div>
</div>

<!-- panel opiekuna -->
<div class="sheet" id="caregiverPanel">
  <div class="sheet-inner" id="caregiverInner"></div>
</div>

<div id="toast"></div>

<script src="js/icons.js"></script>
<script src="js/db.js"></script>
<script src="js/data.js"></script>
<script src="js/tts.js"></script>
<script src="js/share.js"></script>
<script src="js/app.js"></script>
<script src="js/caregiver.js"></script>
<script>
  // Service worker działa tylko na HTTPS (albo localhost). Z file:// po prostu go nie ma.
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { /* offline bez SW */ });
    });
  }
</script>
</body>
</html>
