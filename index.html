<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#37474f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mowa Taty</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="boot">Uruchamiam…</div>

<div id="app" hidden>

  <!-- pasek budowania zdania -->
  <header id="sentenceBar">
    <div id="sentence" aria-live="polite"></div>
    <!-- ikony wstawia app.js (Icons.svg), żeby były wektorowe i duże -->
    <div id="barActions">
      <button id="btnSpeakAll" type="button" title="Powiedz całe zdanie"></button>
      <button id="btnBackspace" type="button" title="Wyczyść zdanie"></button>
      <button id="btnSend" type="button" title="Wyślij komunikat"></button>
    </div>
  </header>

  <!-- nagłówek tablicy (przytrzymaj 3 s = tryb opiekuna) -->
  <div id="boardHead">
    <span id="boardTitle">Start</span>
    <span id="modeTag">TRYB OPIEKUNA</span>
  </div>

  <!-- kafelki -->
  <main id="grid"></main>

  <!-- stały dolny pasek: TAK / NIE zawsze widoczne -->
  <nav id="nav">
    <button id="btnYes" type="button">TAK</button>
    <button id="btnNo" type="button">NIE</button>
    <button id="btnUp" type="button"></button>
    <button id="btnHome" type="button"></button>
  </nav>

</div>

<!-- arkusz wysyłki -->
<div class="sheet" id="sendSheet">
  <div class="sheet-inner">
    <h2>Wyślij komunikat</h2>
    <div class="msg-preview" id="sendPreview"></div>
    <div class="big-actions" id="sendActions"></div>
    <button class="sheet-close" type="button" data-close="sendSheet">Zamknij</button>
  </div>
</div>

<!-- arkusz osoby -->
<div class="sheet" id="personSheet">
  <div class="sheet-inner">
    <h2 id="personName">Osoba</h2>
    <div class="msg-preview" id="personPreview"></div>
    <div class="big-actions" id="personActions"></div>
    <button class="sheet-close" type="button" data-close="personSheet">Zamknij</button>
  </div>
</div>

<!-- panel opiekuna -->
<div class="sheet" id="caregiverPanel">
  <div class="sheet-inner" id="caregiverInner"></div>
</div>

<!-- własne okienka zamiast prompt()/confirm() — natywne bywają blokowane
     w zainstalowanej aplikacji, zwłaszcza na iPhonie -->
<div class="sheet" id="dialog">
  <div class="sheet-inner" id="dialogInner"></div>
</div>

<div id="toast"></div>

<script src="js/icons.js"></script>
<script src="js/db.js"></script>
<script src="js/data.js"></script>
<script src="js/tts.js"></script>
<script src="js/share.js"></script>
<script src="js/remote.js"></script>
<script src="js/app.js"></script>
<script src="js/caregiver.js"></script>
<script>
  // Service worker działa tylko na HTTPS (albo localhost). Z file:// po prostu go nie ma.
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').then(function (reg) {

        // Sprawdzaj, czy na serwerze jest nowsza wersja aplikacji — przy
        // starcie, po powrocie do aplikacji i co pół godziny. Dzięki temu
        // poprawki docierają na telefon bez żadnej akcji użytkownika.
        function look() { reg.update().catch(function () {}); }
        setInterval(look, 30 * 60 * 1000);
        document.addEventListener('visibilitychange', function () {
          if (!document.hidden) { look(); }
        });
      }).catch(function () { /* offline bez SW */ });

      // Nowy service worker przejął stronę → przeładuj, ale tylko wtedy,
      // gdy nie przerwiemy budowanego właśnie zdania ani wypowiedzi.
      var reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (reloading) { return; }
        reloading = true;

        (function waitForCalm() {
          var busy = (window.App && App.sentenceText && App.sentenceText()) ||
                     (window.TTS && TTS.state && TTS.state.speaking);
          if (busy) { setTimeout(waitForCalm, 5000); return; }
          location.reload();
        }());
      });
    });
  }
</script>
</body>
</html>
